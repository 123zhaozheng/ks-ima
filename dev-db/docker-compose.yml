services:
  postgres:
    image: abcfy2/zhparser:18
    shm_size: 1g
    user: postgres
    restart: always
    healthcheck:
      test: 'pg_isready -U user --dbname=postgres'
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 127.0.0.1:5430:5432
    environment:
      POSTGRES_USER: user
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: '--locale=C  --encoding=UTF8'
    command: |
      postgres 
      -c wal_level=logical
      -c max_wal_senders=10 
      -c max_replication_slots=5 
      -c hot_standby=on 
      -c hot_standby_feedback=on
    volumes:
      - pgdata:/var/lib/postgresql
    configs:
      - source: init_db
        target: /docker-entrypoint-initdb.d/init.sql

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        i=0
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          i=$$((i+1))
          if [ $$i -gt 30 ]; then exit 1; fi
          sleep 1
        done
        mc mb -p local/nyaai
        mc anonymous set download local/nyaai

  zero-cache:
    image: rocicorp/zero:0.26.1
    restart: unless-stopped
    ports:
      - 127.0.0.1:4848:4848
    environment:
      ZERO_UPSTREAM_DB: postgres://user:password@postgres:5432/app
      ZERO_CVR_DB: postgres://user:password@postgres:5432/zero
      ZERO_CHANGE_DB: postgres://user:password@postgres:5432/zero
      ZERO_REPLICA_FILE: /data/zero.db
      ZERO_ADMIN_PASSWORD: devpassword
      NODE_ENV: development
      ZERO_QUERY_URL: http://host.docker.internal:3000/api/zero/query
      ZERO_MUTATE_URL: http://host.docker.internal:3000/api/zero/mutate
      ZERO_QUERY_FORWARD_COOKIES: "true"
      ZERO_MUTATE_FORWARD_COOKIES: "true"
      ZERO_NUM_SYNC_WORKERS: "3"
      ZERO_CVR_MAX_CONNS: "6"
      ZERO_UPSTREAM_MAX_CONNS: "6"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - zero-cache-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4848/keepalive"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
    driver: local
  miniodata:
    driver: local
  zero-cache-data:
    driver: local

configs:
  init_db:
    content: |
      CREATE DATABASE app;
      CREATE DATABASE zero;

      \c app;
      CREATE EXTENSION IF NOT EXISTS zhparser;