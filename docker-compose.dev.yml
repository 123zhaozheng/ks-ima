# Local development infrastructure: zhparser+pgvector Postgres and MinIO.
# Ports/credentials match .env and backend/run_server.py.
name: nyaai-dev

services:
  db:
    # Builds the zhparser+pgvector image on first run so a fresh clone works
    # without a pre-existing nyaai-db:latest.
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: nyaai-db:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d app"]
      interval: 5s
    ports:
      - "5430:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    configs:
      - source: init_db
        target: /docker-entrypoint-initdb.d/init.sql

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:

configs:
  init_db:
    content: |
      CREATE DATABASE zero;

      \c app;
      CREATE EXTENSION IF NOT EXISTS zhparser;
      CREATE EXTENSION IF NOT EXISTS vector;
