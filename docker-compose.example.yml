services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_PASSWORD: pass
      POSTGRES_INITDB_ARGS: '--locale=C  --encoding=UTF8'
    command: postgres -c wal_level=logical
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
    volumes:
      - pgdata:/var/lib/postgresql
    configs:
      - source: init_db
        target: /docker-entrypoint-initdb.d/init.sql

  server:
    image: krytro/nyaai-server:latest
    # or build from source:
    # build:
    #   context: .
    #   dockerfile: Dockerfile.server
    environment:
      SITE_NAME: 'Nya AI'
      FRONT_URL: update-this
      ADMIN_URL: update-this
      DATABASE_URL: postgres://postgres:pass@db:5432/app
      S3_ACCESS_KEY_ID: update-this
      S3_SECRET_ACCESS_KEY: update-this
      S3_ENDPOINT: update-this
      S3_REGION: update-this
      S3_BUCKET: update-this
      PYTHON_API_INTERNAL_URL: http://ima-api:8000
      IMA_BRIDGE_TOKEN: ${IMA_BRIDGE_TOKEN:?set a private bridge token}
      IMA_BRIDGE_TIMEOUT_MS: ${IMA_BRIDGE_TIMEOUT_MS:-1500}

    depends_on:
      db:
        condition: service_healthy

  ima-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: api
    environment:
      IMA_DATABASE_URL: postgresql+asyncpg://postgres:pass@db:5432/app
      IMA_PUBLIC_ORIGIN: ${IMA_PUBLIC_ORIGIN:-http://localhost:8080}
      IMA_ENVIRONMENT: ${IMA_ENVIRONMENT:-development}
      IMA_BUILD_VERSION: ${IMA_BUILD_VERSION:-dev}
      IMA_TASK_SCHEMA: ima_jobs
      IMA_CORS_ORIGINS: ${IMA_CORS_ORIGINS:-http://localhost:8080}
      IMA_DIAGNOSTIC_QUEUE: ${IMA_DIAGNOSTIC_QUEUE:-diagnostic}
      IMA_WORKER_NAME: ${IMA_WORKER_NAME:-diagnostic-worker}
      IMA_INGESTION_QUEUE: ${IMA_INGESTION_QUEUE:-ingestion}
      IMA_STORAGE_ENDPOINT: ${IMA_STORAGE_ENDPOINT:-}
      IMA_STORAGE_REGION: ${IMA_STORAGE_REGION:-us-east-1}
      IMA_STORAGE_BUCKET: ${IMA_STORAGE_BUCKET:-}
      IMA_STORAGE_ACCESS_KEY_ID: ${IMA_STORAGE_ACCESS_KEY_ID:-}
      IMA_STORAGE_SECRET_ACCESS_KEY: ${IMA_STORAGE_SECRET_ACCESS_KEY:-}
      IMA_BRIDGE_TOKEN: ${IMA_BRIDGE_TOKEN:?set a private bridge token}
      IMA_MODEL_KEY_RING: ${IMA_MODEL_KEY_RING:?set the versioned model key ring}
      IMA_MODEL_CURRENT_KEY_VERSION: ${IMA_MODEL_CURRENT_KEY_VERSION:-v1}
      IMA_MODEL_FINGERPRINT_KEY: ${IMA_MODEL_FINGERPRINT_KEY:?set the model fingerprint key}
      IMA_MODEL_CUSTOM_CA_DIR: ${IMA_MODEL_CUSTOM_CA_DIR:-/run/secrets/model-ca}
      IMA_MODEL_ALLOWED_HOSTS: ${IMA_MODEL_ALLOWED_HOSTS:-}
      IMA_MODEL_ALLOWED_CIDRS: ${IMA_MODEL_ALLOWED_CIDRS:-}
      IMA_MODEL_ALLOW_INSECURE_PRIVATE: ${IMA_MODEL_ALLOW_INSECURE_PRIVATE:-false}
    depends_on:
      ima-migrate:
        condition: service_completed_successfully

  ima-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: worker
    environment:
      IMA_DATABASE_URL: postgresql+asyncpg://postgres:pass@db:5432/app
      IMA_ENVIRONMENT: ${IMA_ENVIRONMENT:-development}
      IMA_PUBLIC_ORIGIN: ${IMA_PUBLIC_ORIGIN:-http://localhost:8080}
      IMA_CORS_ORIGINS: ${IMA_CORS_ORIGINS:-http://localhost:8080}
      IMA_BUILD_VERSION: ${IMA_BUILD_VERSION:-dev}
      IMA_TASK_SCHEMA: ima_jobs
      IMA_DIAGNOSTIC_QUEUE: ${IMA_DIAGNOSTIC_QUEUE:-diagnostic}
      IMA_WORKER_NAME: ${IMA_WORKER_NAME:-diagnostic-worker}
      IMA_INGESTION_QUEUE: ${IMA_INGESTION_QUEUE:-ingestion}
      IMA_STORAGE_ENDPOINT: ${IMA_STORAGE_ENDPOINT:-}
      IMA_STORAGE_REGION: ${IMA_STORAGE_REGION:-us-east-1}
      IMA_STORAGE_BUCKET: ${IMA_STORAGE_BUCKET:-}
      IMA_STORAGE_ACCESS_KEY_ID: ${IMA_STORAGE_ACCESS_KEY_ID:-}
      IMA_STORAGE_SECRET_ACCESS_KEY: ${IMA_STORAGE_SECRET_ACCESS_KEY:-}
    depends_on:
      ima-migrate:
        condition: service_completed_successfully

  ima-migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: base
    command: ["uv", "run", "--project", "backend", "ima", "migrate"]
    environment:
      IMA_DATABASE_URL: postgresql+asyncpg://postgres:pass@db:5432/app
      IMA_ENVIRONMENT: ${IMA_ENVIRONMENT:-development}
      IMA_PUBLIC_ORIGIN: ${IMA_PUBLIC_ORIGIN:-http://localhost:8080}
      IMA_CORS_ORIGINS: ${IMA_CORS_ORIGINS:-http://localhost:8080}
      IMA_TASK_SCHEMA: ima_jobs
    depends_on:
      db:
        condition: service_healthy

  ima-integration:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: base
    command: ["sh", "-c", "cd backend && uv run --project . ima migrate && uv run --project . pytest -s -m postgres"]
    environment:
      IMA_DATABASE_URL: postgresql+asyncpg://postgres:pass@db:5432/app
      IMA_TEST_DATABASE_URL: postgresql+asyncpg://postgres:pass@db:5432/app
      IMA_ENVIRONMENT: test
      IMA_TASK_SCHEMA: ima_jobs
      IMA_DIAGNOSTIC_QUEUE: diagnostic-integration
      IMA_WORKER_NAME: diagnostic-integration-worker
      IMA_REQUIRE_POSTGRES: "1"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: krytro/nyaai-web:latest
    # or build from source:
    # build:
    #   context: .
    #   dockerfile: Dockerfile.web
    ports:
      - 8080:8080 # user frontend
      - 8081:8081 # admin frontend
    environment:
      SERVER_URL: http://server:3000
      ZERO_CACHE_URL: http://zero-cache:4848
      PYTHON_API_URL: http://ima-api:8000
      PYTHON_API_INTERNAL_URL: http://ima-api:8000
      IMA_BRIDGE_TOKEN: ${IMA_BRIDGE_TOKEN:?set a private bridge token}
      IMA_BRIDGE_TIMEOUT_MS: ${IMA_BRIDGE_TIMEOUT_MS:-1500}
 
  zero-cache:
    image: rocicorp/zero:0.26.1
    environment:
      ZERO_UPSTREAM_DB: postgres://postgres:pass@db:5432/app
      ZERO_CVR_DB: postgres://postgres:pass@db:5432/zero
      ZERO_CHANGE_DB: postgres://postgres:pass@db:5432/zero
      ZERO_REPLICA_FILE: /data/zero.db
      # Password used to access the inspector and /statz
      ZERO_ADMIN_PASSWORD: pickanewpassword
      ZERO_QUERY_URL: http://server:3000/api/zero/query
      ZERO_MUTATE_URL: http://server:3000/api/zero/mutate
      ZERO_QUERY_FORWARD_COOKIES: true
      ZERO_MUTATE_FORWARD_COOKIES: true
    volumes:
      # Disk for the SQLite replica should be high IOPS
      - zero-cache-data:/data
    depends_on:
      server:
        condition: service_started
    healthcheck:
      test: curl -f http://localhost:4848/keepalive
      interval: 5s

volumes:
  pgdata:
  zero-cache-data:

configs:
  init_db:
    content: |
      CREATE DATABASE app;
      CREATE DATABASE zero;

      \c app;
      CREATE EXTENSION IF NOT EXISTS zhparser;
