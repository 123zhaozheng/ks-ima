services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_PASSWORD: pass
      POSTGRES_INITDB_ARGS: '--locale=C  --encoding=UTF8'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
    volumes:
      - pgdata:/var/lib/postgresql
    configs:
      - source: init_db
        target: /docker-entrypoint-initdb.d/init.sql

  ima-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: api
    environment:
      IMA_DATABASE_URL: postgresql+asyncpg://postgres:pass@db:5432/app
      IMA_PUBLIC_ORIGIN: ${IMA_PUBLIC_ORIGIN:-http://localhost:8080}
      IMA_ENVIRONMENT: ${IMA_ENVIRONMENT:-development}
      IMA_BUILD_VERSION: ${IMA_BUILD_VERSION:-dev}
      IMA_TASK_SCHEMA: ima_jobs
      IMA_CORS_ORIGINS: ${IMA_CORS_ORIGINS:-http://localhost:8080}
      # The API is internal-only; trust forwarded client addresses solely from the Docker proxy network.
      IMA_TRUSTED_PROXIES: ${IMA_TRUSTED_PROXIES:-172.16.0.0/12}
      IMA_DIAGNOSTIC_QUEUE: ${IMA_DIAGNOSTIC_QUEUE:-diagnostic}
      IMA_WORKER_NAME: ${IMA_WORKER_NAME:-diagnostic-worker}
      IMA_INGESTION_QUEUE: ${IMA_INGESTION_QUEUE:-ingestion}
      IMA_STORAGE_ENDPOINT: ${IMA_STORAGE_ENDPOINT:-}
      IMA_STORAGE_REGION: ${IMA_STORAGE_REGION:-us-east-1}
      IMA_STORAGE_BUCKET: ${IMA_STORAGE_BUCKET:-}
      IMA_STORAGE_ACCESS_KEY_ID: ${IMA_STORAGE_ACCESS_KEY_ID:-}
      IMA_STORAGE_SECRET_ACCESS_KEY: ${IMA_STORAGE_SECRET_ACCESS_KEY:-}
      IMA_MODEL_KEY_RING: ${IMA_MODEL_KEY_RING:?set the versioned model key ring}
      IMA_MODEL_CURRENT_KEY_VERSION: ${IMA_MODEL_CURRENT_KEY_VERSION:-v1}
      IMA_MODEL_FINGERPRINT_KEY: ${IMA_MODEL_FINGERPRINT_KEY:?set the model fingerprint key}
      IMA_MODEL_CUSTOM_CA_DIR: ${IMA_MODEL_CUSTOM_CA_DIR:-/run/secrets/model-ca}
      IMA_MODEL_ALLOWED_HOSTS: ${IMA_MODEL_ALLOWED_HOSTS:-}
      IMA_MODEL_ALLOWED_CIDRS: ${IMA_MODEL_ALLOWED_CIDRS:-}
      IMA_MODEL_ALLOW_INSECURE_PRIVATE: ${IMA_MODEL_ALLOW_INSECURE_PRIVATE:-false}
    depends_on:
      ima-migrate:
        condition: service_completed_successfully

  ima-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: worker
    environment:
      IMA_DATABASE_URL: postgresql+asyncpg://postgres:pass@db:5432/app
      IMA_ENVIRONMENT: ${IMA_ENVIRONMENT:-development}
      IMA_PUBLIC_ORIGIN: ${IMA_PUBLIC_ORIGIN:-http://localhost:8080}
      IMA_CORS_ORIGINS: ${IMA_CORS_ORIGINS:-http://localhost:8080}
      IMA_BUILD_VERSION: ${IMA_BUILD_VERSION:-dev}
      IMA_TASK_SCHEMA: ima_jobs
      IMA_DIAGNOSTIC_QUEUE: ${IMA_DIAGNOSTIC_QUEUE:-diagnostic}
      IMA_WORKER_NAME: ${IMA_WORKER_NAME:-diagnostic-worker}
      IMA_INGESTION_QUEUE: ${IMA_INGESTION_QUEUE:-ingestion}
      IMA_STORAGE_ENDPOINT: ${IMA_STORAGE_ENDPOINT:-}
      IMA_STORAGE_REGION: ${IMA_STORAGE_REGION:-us-east-1}
      IMA_STORAGE_BUCKET: ${IMA_STORAGE_BUCKET:-}
      IMA_STORAGE_ACCESS_KEY_ID: ${IMA_STORAGE_ACCESS_KEY_ID:-}
      IMA_STORAGE_SECRET_ACCESS_KEY: ${IMA_STORAGE_SECRET_ACCESS_KEY:-}
    depends_on:
      ima-migrate:
        condition: service_completed_successfully

  ima-migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: base
    command: ["uv", "run", "--project", "backend", "ima", "migrate"]
    environment:
      IMA_DATABASE_URL: postgresql+asyncpg://postgres:pass@db:5432/app
      IMA_ENVIRONMENT: ${IMA_ENVIRONMENT:-development}
      IMA_PUBLIC_ORIGIN: ${IMA_PUBLIC_ORIGIN:-http://localhost:8080}
      IMA_CORS_ORIGINS: ${IMA_CORS_ORIGINS:-http://localhost:8080}
      IMA_TASK_SCHEMA: ima_jobs
    depends_on:
      db:
        condition: service_healthy

  ima-integration:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: base
    command: ["sh", "-c", "cd backend && uv run --project . ima migrate && uv run --project . pytest -s -m postgres"]
    environment:
      IMA_DATABASE_URL: postgresql+asyncpg://postgres:pass@db:5432/app
      IMA_TEST_DATABASE_URL: postgresql+asyncpg://postgres:pass@db:5432/app
      IMA_ENVIRONMENT: test
      IMA_TASK_SCHEMA: ima_jobs
      IMA_DIAGNOSTIC_QUEUE: diagnostic-integration
      IMA_WORKER_NAME: diagnostic-integration-worker
      IMA_REQUIRE_POSTGRES: "1"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: krytro/nyaai-web:latest
    # or build from source:
    # build:
    #   context: .
    #   dockerfile: Dockerfile.web
    ports:
      - 8080:8080 # app (user frontend + admin console at /admin)
    environment:
      PYTHON_API_URL: http://ima-api:8000

volumes:
  pgdata:

configs:
  init_db:
    content: |
      CREATE DATABASE app;

      \c app;
      CREATE EXTENSION IF NOT EXISTS zhparser;
